name: Release alpha

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example alpha-2026-08-19
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: flutter pub get --enforce-lockfile
      - run: s/lint
      - run: s/test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - run: tar -czf neomate-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-bundle
          path: neomate-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - build-android
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$REPO" \
            --target "$RELEASE_COMMIT" \
            --title "Internal alpha $RELEASE_TAG" \
            --notes "Non-clinical evaluation build. Publicly downloadable; intended for agreed project collaborators. Not reviewed, not approved for patient care, not a distributable medical-device release. See spec/internal-alpha.md for scope and known limitations. Android APK is debug-signed; Linux bundle is unsigned." \
            --prerelease \
            artifacts/app-release.apk#neomate-alpha.apk \
            artifacts/neomate-linux-x64.tar.gz
